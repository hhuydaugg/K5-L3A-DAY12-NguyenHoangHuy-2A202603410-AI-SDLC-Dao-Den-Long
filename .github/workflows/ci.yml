name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run verify -- ci
      - name: soak (10 nights in one process, Ticket-04)
        run: npm run soak && cat soak.json
