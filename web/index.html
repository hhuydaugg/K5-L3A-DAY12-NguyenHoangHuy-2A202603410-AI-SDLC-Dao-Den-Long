<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đảo Đèn Lồng</title>
<style>
  :root { --warm: #ffb347; --ink: #f6ead8; --muted: #c9b8d8; --danger: #b48cff; --panel: rgba(18, 12, 34, .72); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0a1a; color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 12px; display: flex; gap: 10px; flex-wrap: wrap; pointer-events: none; }
  .pill { background: var(--panel); border: 1px solid rgba(255, 179, 71, .35); border-radius: 10px; padding: 6px 12px; }
  .pill b { color: var(--warm); }
  #hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: var(--panel); border-radius: 10px;
          padding: 6px 14px; color: var(--muted); font-size: 13px; pointer-events: none; text-align: center; }
  #toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); color: var(--warm); font-weight: 600; font-size: 18px;
           text-shadow: 0 0 12px rgba(255, 160, 60, .8); pointer-events: none; opacity: 0; transition: opacity .3s; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 5, 18, .62); }
  #overlay[hidden] { display: none; }
  .card { background: var(--panel); border: 1px solid rgba(255, 179, 71, .45); border-radius: 16px; padding: 28px 32px; max-width: 520px; text-align: center; }
  .card h1 { margin: 0 0 6px; color: var(--warm); font-size: 30px; }
  .card p { margin: 6px 0; }
  .card table { margin: 14px auto 0; border-collapse: collapse; text-align: left; font-size: 14px; }
  .card td { padding: 2px 10px; } .card td:first-child { color: var(--warm); font-weight: 600; white-space: nowrap; }
  button { margin-top: 16px; font: inherit; font-weight: 600; background: var(--warm); color: #2a1600; border: 0; border-radius: 10px; padding: 10px 22px; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  #flash { position: fixed; inset: 0; background: #5b2a9a; opacity: 0; pointer-events: none; transition: opacity .25s; }
</style>
</head>
<body>
<div id="hud" aria-live="polite">
  <span class="pill">Lửa <b id="h-flames"></b></span>
  <span class="pill">Đom đóm <b id="h-carried"></b></span>
  <span class="pill">Đèn <b id="h-lit"></b></span>
  <span class="pill">Trời sáng sau <b id="h-time"></b></span>
  <span class="pill">Điểm <b id="h-score"></b></span>
</div>
<div id="toast"></div>
<div id="hint"></div>
<div id="flash"></div>
<div id="overlay">
  <div class="card" id="card"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
