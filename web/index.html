<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đảo Đèn Lồng</title>
<style>
  /* Ticket-02 palette: UI text #F5F1E6, danger #FF5A5F, gold/score #F2C14E, lantern #FFB347, night #0E1430 / #1B2350 */
  :root { --text: #F5F1E6; --danger: #FF5A5F; --gold: #F2C14E; --warm: #FFB347; --night: #0E1430; --fog: #1B2350; --panel: rgba(14, 20, 48, .78); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px #000; }
  #h-flames { top: 12px; left: 14px; font-size: 26px; letter-spacing: 4px; color: var(--warm); }
  #h-flames .off { color: #5B5F6E; }
  #h-clock { top: 10px; left: 50%; transform: translateX(-50%); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #h-clock.danger { color: var(--danger); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  #h-right { top: 12px; right: 14px; text-align: right; font-size: 17px; }
  #h-right b { color: var(--gold); }
  #h-bar { bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; }
  #h-bar i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255, 229, 138, .55); background: rgba(14, 20, 48, .6); }
  #h-bar i.on { background: radial-gradient(#FFF6C2, #FFE58A 60%, #FFB347); box-shadow: 0 0 10px #FFE58A; }
  #h-cd { bottom: 14px; right: 16px; display: flex; gap: 12px; }
  .cd { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700;
        background: conic-gradient(rgba(14,20,48,.85) var(--p, 0%), rgba(242,193,78,.85) 0); border: 2px solid var(--gold); color: #1a1206; }
  .cd span { background: rgba(245, 241, 230, .9); border-radius: 6px; padding: 0 4px; }
  #h-prompt { bottom: 64px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--gold); border-radius: 10px; padding: 6px 14px; font-weight: 600; }
  #h-arrow { width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 30px solid var(--warm);
             filter: drop-shadow(0 0 6px #FFB347); top: 0; left: 0; transform-origin: 50% 60%; }
  #h-wind { top: 52px; left: 50%; transform: translateX(-50%); color: #8FA3B8; font-weight: 600; }
  #h-fps { bottom: 4px; left: 8px; font-size: 11px; opacity: .7; }
  #toast { position: fixed; top: 92px; left: 50%; transform: translateX(-50%); color: var(--warm); font-weight: 600; font-size: 18px;
           text-shadow: 0 0 12px rgba(255, 160, 60, .8); pointer-events: none; opacity: 0; transition: opacity .3s; }
  #flash { position: fixed; inset: 0; background: #7A3CFF; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 10, 28, .66); }
  #overlay[hidden], [hidden] { display: none !important; }
  .card { background: var(--panel); border: 1px solid rgba(242, 193, 78, .55); border-radius: 16px; padding: 26px 32px; width: min(560px, 92vw); text-align: center; }
  .card h1 { margin: 0 0 6px; color: var(--gold); font-size: 32px; }
  .card h2 { margin: 0 0 8px; color: var(--warm); font-size: 22px; }
  .card p { margin: 6px 0; }
  .card .say { font-style: italic; color: #e9dfc8; }
  .card table { margin: 12px auto 0; border-collapse: collapse; text-align: left; font-size: 14px; }
  .card td { padding: 2px 10px; } .card td:first-child { color: var(--gold); font-weight: 600; white-space: nowrap; }
  .card .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; align-items: center; }
  .card label { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin: 10px 0; text-align: left; }
  .card input[type=range] { width: 60%; accent-color: var(--gold); }
  button { font: inherit; font-weight: 600; background: var(--warm); color: #2a1600; border: 0; border-radius: 10px; padding: 9px 22px; min-width: 210px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid rgba(245, 241, 230, .5); }
  button:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
<div class="hud" id="h-flames" aria-label="Ngọn Lửa"></div>
<div class="hud" id="h-clock"></div>
<div class="hud" id="h-right"></div>
<div class="hud" id="h-wind" hidden>Lá đang bay… sắp có gió mạnh!</div>
<div class="hud" id="h-bar" aria-label="Đom đóm đang mang"></div>
<div class="hud" id="h-cd"><div class="cd" id="cd-dash"><span>Lướt</span></div><div class="cd" id="cd-pulse"><span>Tỏa</span></div></div>
<div class="hud" id="h-prompt" hidden></div>
<div class="hud" id="h-arrow" hidden></div>
<div class="hud" id="h-fps"></div>
<div id="toast"></div>
<div id="flash"></div>
<div id="overlay"><div class="card" id="card"></div></div>
<script type="module" src="./main.js"></script>
</body>
</html>
