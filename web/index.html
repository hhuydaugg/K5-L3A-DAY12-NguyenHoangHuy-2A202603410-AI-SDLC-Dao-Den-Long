<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đảo Đèn Lồng</title>
<style>
  /* Ticket-02 palette: UI text #F5F1E6, danger #FF5A5F, gold/score #F2C14E, lantern #FFB347, night #0E1430 / #1B2350 */
  :root { --text: #F5F1E6; --danger: #FF5A5F; --gold: #F2C14E; --warm: #FFB347; --night: #0E1430; --fog: #1B2350; --panel: rgba(14, 20, 48, .82); --shade: #7A3CFF;
          font-size: 18px; } /* Ticket-04: no UI text under 18 px at 1280x720; every size below is in rem */
  html.big { font-size: 22.5px; } /* "chữ lớn" x1.25 */
  /* Ticket-03 colour-blind palette: shade rim #00B3FF, warnings white with a ⚠ icon */
  body.cb { --danger: #FFFFFF; --shade: #00B3FF; }
  body.cb .danger::before { content: "⚠ "; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--text); overflow: hidden; }
  body { font: 1rem/1.4 system-ui, "Segoe UI", sans-serif; }
  canvas { display: block; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px #000; }
  #h-flames { top: .6rem; left: .8rem; font-size: 1.45rem; letter-spacing: .2rem; color: var(--warm); }
  #h-flames .off { color: #5B5F6E; }
  #h-clock { top: .5rem; left: 50%; transform: translateX(-50%); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  #h-clock.danger { color: var(--danger); animation: blink 1s steps(2) infinite; }
  body.calm #h-clock.danger { animation: none; }
  @keyframes blink { 50% { opacity: .25; } }
  #h-right { top: .6rem; right: .8rem; text-align: right; font-size: 1rem; }
  #h-right b { color: var(--gold); }
  #h-right .danger { color: var(--danger); }
  #h-bar { bottom: .9rem; left: 50%; transform: translateX(-50%); display: flex; gap: .25rem; }
  #h-bar i { width: 1.15rem; height: 1.15rem; border-radius: 50%; border: 2px solid rgba(255, 229, 138, .55); background: rgba(14, 20, 48, .6); }
  #h-bar i[hidden] { display: none; }
  #h-bar i.on { background: radial-gradient(#FFF6C2, #FFE58A 60%, #FFB347); box-shadow: 0 0 10px #FFE58A; }
  #h-carry { bottom: 2.3rem; left: 50%; transform: translateX(-50%); font-size: 1rem; font-weight: 600; }
  #h-cd { bottom: .8rem; right: .9rem; display: flex; gap: .6rem; }
  .cd { width: 3.9rem; height: 3.9rem; border-radius: 50%; display: grid; place-items: center; font-size: 1rem; font-weight: 700;
        background: conic-gradient(rgba(14,20,48,.85) var(--p, 0%), rgba(242,193,78,.85) 0); border: 2px solid var(--gold); color: #1a1206; }
  .cd span { background: rgba(245, 241, 230, .92); border-radius: 6px; padding: 0 .2rem; }
  #h-prompt { bottom: 4.2rem; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--gold); border-radius: 10px; padding: .3rem .8rem; font-weight: 600; }
  #h-caption { bottom: 7rem; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, .7); border-radius: 8px; padding: .25rem .8rem;
               font-weight: 600; text-align: center; max-width: 80vw; }
  #h-caption .danger { color: var(--danger); }
  .arrow { width: 0; height: 0; border-left: .8rem solid transparent; border-right: .8rem solid transparent; border-bottom: 1.7rem solid var(--warm);
           filter: drop-shadow(0 0 6px #FFB347); top: 0; left: 0; transform-origin: 50% 60%; }
  #h-shade-arrow { border-bottom-color: var(--shade); filter: drop-shadow(0 0 6px var(--shade)); }
  #h-fps { bottom: .2rem; left: .4rem; font-size: 1rem; opacity: .7; }
  #toast { position: fixed; top: 5rem; left: 50%; transform: translateX(-50%); color: var(--warm); font-weight: 600; font-size: 1.05rem; white-space: nowrap;
           text-shadow: 0 0 12px rgba(255, 160, 60, .8); pointer-events: none; opacity: 0; transition: opacity .3s; }
  #flash { position: fixed; inset: 0; background: var(--shade); opacity: 0; pointer-events: none; transition: opacity .25s; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 10, 28, .66); overflow-y: auto; }
  #overlay[hidden], [hidden] { display: none !important; }
  .card { background: var(--panel); border: 1px solid rgba(242, 193, 78, .55); border-radius: 16px; padding: 1.3rem 1.6rem; width: min(36rem, 94vw);
          max-height: 96vh; overflow-y: auto; text-align: center; }
  .card h1 { margin: 0 0 .3rem; color: var(--gold); font-size: 1.8rem; }
  .card h2 { margin: 0 0 .4rem; color: var(--warm); font-size: 1.3rem; }
  .card p { margin: .35rem 0; }
  .card .say { font-style: italic; color: #e9dfc8; }
  .card table { margin: .6rem auto 0; border-collapse: collapse; text-align: left; font-size: 1rem; }
  .card td, .card th { padding: .1rem .5rem; } .card td:first-child { color: var(--gold); font-weight: 600; white-space: nowrap; }
  .card tr.me td { background: rgba(242, 193, 78, .2); }
  .card .btns { display: flex; flex-direction: column; gap: .45rem; margin-top: .9rem; align-items: center; }
  .card label { display: flex; justify-content: space-between; gap: .6rem; align-items: center; margin: .45rem 0; text-align: left; }
  .card input[type=range] { width: 55%; accent-color: var(--gold); }
  .card input[type=checkbox] { width: 1.2rem; height: 1.2rem; accent-color: var(--gold); }
  .card input[type=text] { font: inherit; padding: .3rem .6rem; border-radius: 8px; border: 1px solid var(--gold); background: #0b1028; color: var(--text); width: 14rem; }
  .card .keys { display: grid; grid-template-columns: 1fr auto; gap: .25rem .6rem; align-items: center; text-align: left; margin: .5rem 0; }
  .card .keys button { min-width: 8rem; padding: .2rem .6rem; }
  .card .msg { min-height: 1.4em; color: var(--danger); font-weight: 600; }
  button { font: inherit; font-weight: 600; background: var(--warm); color: #2a1600; border: 0; border-radius: 10px; padding: .45rem 1.2rem; min-width: 12rem; cursor: pointer; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid rgba(245, 241, 230, .5); }
  button:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  body.bench #overlay { display: none !important; }
</style>
</head>
<body>
<div class="hud" id="h-flames" aria-label="Ngọn Lửa"></div>
<div class="hud" id="h-clock"></div>
<div class="hud" id="h-right"></div>
<div class="hud" id="h-bar" aria-label="Đom đóm đang mang"></div>
<div class="hud" id="h-carry"></div>
<div class="hud" id="h-cd"><div class="cd" id="cd-dash"><span>Lướt</span></div><div class="cd" id="cd-pulse"><span>Tỏa</span></div></div>
<div class="hud" id="h-prompt" hidden></div>
<div class="hud" id="h-caption" role="status" aria-live="polite" hidden></div>
<div class="hud arrow" id="h-arrow" hidden></div>
<div class="hud arrow" id="h-shade-arrow" hidden></div>
<div class="hud" id="h-fps" hidden></div>
<div id="toast"></div>
<div id="flash"></div>
<div id="overlay"><div class="card" id="card"></div></div>
<script type="module" src="./main.js"></script>
</body>
</html>
